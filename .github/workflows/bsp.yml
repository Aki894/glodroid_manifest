name: WukongPi BSP (XR819 retained)
on:
  workflow_dispatch:
  push:
    paths:
      - 'patches/**'
      - 'scripts/**'
      - 'device/**'
      - 'sources.lock.json'
      - '.github/workflows/bsp.yml'
permissions:
  contents: read
concurrency:
  group: bsp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex bc cpio \
            libssl-dev libelf-dev libgmp-dev libmpc-dev libmpfr-dev \
            device-tree-compiler swig python3-dev python3-setuptools python3-pyelftools
      - name: Fetch pinned BSP sources
        run: python3 scripts/fetch-bsp.py "$RUNNER_TEMP/bsp-source"
      - name: Compile bootloader, kernel, DTB and XR819
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/bsp-output"
          scripts/build-bsp.sh "$RUNNER_TEMP/bsp-source" "$RUNNER_TEMP/bsp-output" 4 \
            2>&1 | tee "$RUNNER_TEMP/bsp-output/build.log"
      - name: Preserve build logs and components
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wukongpi-bsp-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/bsp-output/artifacts
            ${{ runner.temp }}/bsp-output/build.log
          if-no-files-found: warn
          retention-days: 14
